[project]
name = "mcp-shopify-meta"
version = "0.1.0"
description = "MCP server providing generic schema-walking access to the Shopify Admin GraphQL API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tim Zenderman" }]
license = { text = "MIT" }
# fastmcp is upper-bounded on purpose: an unbounded SDK range across a major
# boundary is how mcp-intercom/mcp-shipstation broke (mcp>=1.26.0 resolved to
# 2.0.0, which removed mcp.server.fastmcp — the servers then registered zero
# tools, silently). Verified against fastmcp 3.4.5; re-verify before raising.
# graphql-core is bounded for the same reason: 3.3.0 (2026-09-27) added a
# schema rule that Shopify's own Admin schema violates (implementation field
# deprecated while the interface field is not), so every execute_graphql call
# failed validation. uvx ignores uv.lock, so an unbounded range ships whatever
# PyPI has that morning. tests/test_vendored_schema.py guards a raise.
dependencies = [
    "fastmcp>=2.13.0,<4",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "scalekit-sdk-python>=2.4.0",
    "graphql-core>=3.2.3,<3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["shopify_meta"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

services:
  - type: web
    name: mcp-shopify-meta
    env: python
    # Install exactly what uv.lock pins (--locked fails the build if the lock is
    # stale vs pyproject), then run from that environment. Never `pip install -e .`:
    # it re-resolves from the pyproject ranges, so the audited lock isn't what runs.
    buildCommand: pip install uv==0.10.10 && uv sync --locked --no-dev
    startCommand: .venv/bin/python -m shopify_meta.server_http
    envVars:
      - key: SHOPIFY_STORES
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2026-10
      - key: ISSUE_REPORT_PATH
        value: ./data/issue_reports.jsonl
      - key: SCALEKIT_ENVIRONMENT_URL
        sync: false
      - key: SCALEKIT_RESOURCE_ID
        sync: false
      - key: SERVER_URL
        sync: false
      - key: MCP_LOG_LEVEL
        value: INFO
